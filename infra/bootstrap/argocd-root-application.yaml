apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudforge-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/deploy-config.git
    targetRevision: main
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
