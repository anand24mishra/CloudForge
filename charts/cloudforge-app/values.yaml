nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/OWNER/app
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}
securityContext:
  # Generic PaaS images may declare a named non-root user that Kubernetes cannot
  # verify. Applications can opt into runAsNonRoot: true in their values file.
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

replicaCount: 1
containerPort: 8080
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: app.sslip.io
  path: /
  tls: false
  tlsSecretName: ""

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

probes:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

env: []
nodeSelector: {}
tolerations: []
affinity: {}
